<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[{"id":"brand","type":"string","label":"Nome","default":"Grão & Brasa"},{"id":"tagline","type":"string","label":"Linha de apoio","default":"Café de especialidade · Pinheiros"},{"id":"ground","type":"color","label":"Fundo","default":"#15100c"},{"id":"ember","type":"color","label":"Brasa","default":"#e0793a"},{"id":"cream","type":"color","label":"Creme","default":"#f3e9d8"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/fonts/figtree.woff2") format("woff2");
        font-weight: 300 900;
        font-display: block;
      }
      :root {
        --ground: #15100c;
        --ember: #e0793a;
        --cream: #f3e9d8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      #glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(38% 46% at 50% 40%, rgba(224, 121, 58, 0.32) 0%, rgba(224, 121, 58, 0.09) 45%, rgba(21, 16, 12, 0) 75%),
          radial-gradient(60% 40% at 50% 110%, rgba(163, 71, 43, 0.22) 0%, rgba(21, 16, 12, 0) 70%);
      }
      #steam, #bean {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #brand-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 72%;
        text-align: center;
      }
      #brand {
        font-family: "Fraunces", serif;
        font-weight: 400;
        font-size: 128px;
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--cream);
        font-variation-settings: "SOFT" 60, "opsz" 144;
        display: inline-block;
      }
      #brand .ch { display: inline-block; }
      #tagline {
        margin-top: 26px;
        font-family: "Figtree", sans-serif;
        font-weight: 500;
        font-size: 34px;
        letter-spacing: 0.01em;
        color: var(--ember);
        display: inline-block;
      }
      /* vertical 9:16 */
      html.portrait #brand-wrap { top: 53%; left: 120px; right: 192px; }
      html.portrait #brand { font-size: 118px; }
      html.portrait #tagline { font-size: 38px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
    >
      <div id="glow" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <canvas id="steam" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-ignore></canvas>
      <canvas id="bean" class="clip" data-start="0" data-duration="8" data-track-index="2" data-layout-ignore></canvas>
      <div id="brand-wrap" class="clip" data-start="0" data-duration="8" data-track-index="3">
        <h1 id="brand" data-var-text="brand">Grão &amp; Brasa</h1>
        <br />
        <p id="tagline" data-var-text="tagline">Café de especialidade · Pinheiros</p>
      </div>
    </div>

    <script>
      // Variáveis de cor do Studio
      (function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const r = document.documentElement.style;
        if (v.ground) r.setProperty("--ground", v.ground);
        if (v.ember) r.setProperty("--ember", v.ember);
        if (v.cream) r.setProperty("--cream", v.cream);
        if (v.brand) document.getElementById("brand").textContent = v.brand;
        if (v.tagline) document.getElementById("tagline").textContent = v.tagline;
      })();

      const root = document.getElementById("root");
      const W = Number(root.dataset.width), H = Number(root.dataset.height);
      if (H > W) document.documentElement.classList.add("portrait");

      // separa o nome em letras para a entrada
      const brand = document.getElementById("brand");
      const text = brand.textContent;
      brand.innerHTML = "";
      for (const c of text) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c === " " ? " " : c;
        brand.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      // 0 → 1.1 s: só o grão e o vapor (quadro 0 já é a capa)
      tl.fromTo("#brand .ch", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out", stagger: 0.045 }, 1.1);
      tl.fromTo("#tagline", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.9);
      // saída suave para fechar o loop
      tl.to("#brand", { opacity: 0, duration: 0.8, ease: "power2.in" }, 6.75);
      tl.to("#tagline", { opacity: 0, y: -8, duration: 0.7, ease: "power2.in" }, 6.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="importmap">
      { "imports": { "three": "./lib/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "./lib/jsm/loaders/GLTFLoader.js";
      import { MeshoptDecoder } from "./lib/jsm/libs/meshopt_decoder.module.js";
      import { RoomEnvironment } from "./lib/jsm/environments/RoomEnvironment.js";
      import { prepareScannedBean } from "./lib/orientBean.js";

      const DURATION = 8;
      const root = document.getElementById("root");
      const W = Number(root.dataset.width), H = Number(root.dataset.height);
      const portrait = H > W;

      // ---------- grão 3D (mesma geometria do site) ----------
      function beanGeometry(detail) {
        const geo = new THREE.SphereGeometry(1, detail, Math.round(detail * 0.75));
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          let x = v.x * 0.78, y = v.y * 1.08, z = v.z * 0.62;
          if (z > 0) z *= 0.5;
          const center = 0.09 * Math.sin(y * 2.6);
          const d = x - center;
          const groove = Math.exp(-(d * d) / 0.0035) * Math.max(0, 1 - Math.pow(Math.abs(y) / 1.02, 4));
          if (v.z > 0) z -= groove * 0.22 * Math.min(1, v.z * 3);
          const n = 0.018 * Math.sin(x * 7.1 + y * 3.3) + 0.012 * Math.sin(y * 9.7 - z * 4.1);
          const len = Math.hypot(x, y, z) || 1;
          pos.setXYZ(i, x + (x / len) * n, y + (y / len) * n, z + (z / len) * n);
        }
        geo.computeVertexNormals();
        return geo;
      }

      const canvas = document.getElementById("bean");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(portrait ? 40 : 30, W / H, 0.1, 50);
      camera.position.set(0, 0, 7);

      scene.add(new THREE.AmbientLight(0xffffff, 0.22));
      const key = new THREE.DirectionalLight(0xffb27a, 3.0);
      key.position.set(3, 3, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xf0a46b, 2.2);
      rim.position.set(-4, 1, -3);
      scene.add(rim);
      const under = new THREE.PointLight(0xe0793a, 14, 9);
      under.position.set(0, -2.6, 2);
      scene.add(under);
      const cool = new THREE.DirectionalLight(0xc9d6ff, 0.35);
      cool.position.set(-3, 4, 2);
      scene.add(cool);

      const material = new THREE.MeshPhysicalMaterial({
        color: 0x4a2716,
        roughness: 0.46,
        clearcoat: 0.5,
        clearcoatRoughness: 0.3,
        sheen: 0.25,
        sheenColor: new THREE.Color(0xc9703a),
      });
      // grão real escaneado ("Coffee beans" por kouitimizuno, CC BY 4.0); o desenhado fica só até carregar
      const bean = new THREE.Mesh(beanGeometry(128), material);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;
      const beanReady = new GLTFLoader()
        .setMeshoptDecoder(MeshoptDecoder)
        .loadAsync("assets/models/grao.glb")
        .then((gltf) => {
          const r = prepareScannedBean(gltf.scene, 2.16, true);
          const m = r.material.clone();
          m.roughness = 0.42;
          m.side = THREE.FrontSide;
          bean.geometry = r.geometry;
          bean.material = m;
          return renderer.compileAsync(scene, camera);
        });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.bean = beanReady;
      const group = new THREE.Group();
      group.add(bean);
      scene.add(group);
      // posição do grão: acima do nome
      const beanY = portrait ? 0.75 : 0.36;
      const beanScale = portrait ? 0.9 : 0.96;

      // ---------- vapor (partículas determinísticas) ----------
      const steam = document.getElementById("steam");
      steam.width = W;
      steam.height = H;
      const ctx = steam.getContext("2d");
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(42);
      const PUFFS = 90;
      const puffs = Array.from({ length: PUFFS }, () => ({
        phase: rnd(),
        cycles: 1 + Math.floor(rnd() * 2), // 1 ou 2 subidas por loop → fecha em 8 s
        x: (rnd() - 0.5) * 0.16,
        sway: 0.03 + rnd() * 0.06,
        swayF: 1 + Math.floor(rnd() * 3),
        size: 0.05 + rnd() * 0.07,
        alpha: 0.08 + rnd() * 0.12,
      }));
      const sprite = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        grd.addColorStop(0, "rgba(255,236,214,1)");
        grd.addColorStop(0.45, "rgba(255,225,196,0.35)");
        grd.addColorStop(1, "rgba(255,225,196,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 256, 256);
        return c;
      })();

      function drawSteam(t) {
        ctx.clearRect(0, 0, W, H);
        const unit = Math.min(W, H);
        const cx = W / 2;
        const top = new THREE.Vector3(0, beanY + 0.25 * beanScale, 0).project(camera);
        const baseY = (1 - top.y) / 2 * H; // perto do topo do grão
        for (const p of puffs) {
          const life = (p.phase + (t / DURATION) * p.cycles) % 1;
          const rise = life * unit * 0.55;
          const x = cx + (p.x + Math.sin((t / DURATION) * Math.PI * 2 * p.swayF + p.phase * 6.28) * p.sway * (0.4 + life)) * unit;
          const y = baseY - rise;
          const s = p.size * unit * (0.6 + life * 2.2);
          const a = p.alpha * Math.sin(life * Math.PI) ** 1.4;
          ctx.globalAlpha = a;
          ctx.drawImage(sprite, x - s / 2, y - s / 2, s, s);
        }
        ctx.globalAlpha = 1;
      }

      function renderAt(t) {
        const k = (t % DURATION) / DURATION; // 0 → 1 fecha o loop
        const turn = k * Math.PI * 2;
        group.position.y = beanY + Math.sin(turn) * 0.06;
        group.scale.setScalar(beanScale);
        bean.rotation.set(-0.3 + Math.sin(turn) * 0.12, turn, 0.42 + Math.cos(turn) * 0.05);
        // luz de brasa respira junto
        under.intensity = 12 + Math.sin(turn * 2) * 3;
        renderer.render(scene, camera);
        drawSteam(t);
      }

      let last = 0;
      window.addEventListener("hf-seek", (e) => {
        last = e.detail.time;
        renderAt(last);
      });
      renderAt(0);
      beanReady.then(() => renderAt(last));
    </script>
  </body>
</html>
